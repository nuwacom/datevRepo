name: Deploy to Azure Container Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

# Prevent two deploys racing to update the same (single-replica) Container App.
concurrency:
  group: deploy-datev-mcp
  cancel-in-progress: false

permissions:
  id-token: write # required for OIDC login — no stored Azure secret
  contents: read

env:
  IMAGE_NAME: mcp/datev-mcp # namespaced in the shared nuwacom ACR alongside the app's other images
  CONTAINER_APP_NAME: ca-datev-mcp

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Builds inside ACR itself — no docker/buildx setup needed on the runner.
      - name: Build and push image
        run: |
          az acr build \
            --registry "${{ secrets.ACR_NAME }}" \
            --image "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            --image "${{ env.IMAGE_NAME }}:latest" \
            .

      # Only the "app" container is updated — the redis sidecar's image is
      # pinned in Bicep and isn't part of this repo's build.
      - name: Update Container App
        run: |
          az containerapp update \
            --name "${{ env.CONTAINER_APP_NAME }}" \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --container-name app \
            --image "${{ secrets.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}"

      - name: Logout
        if: always()
        run: az logout
